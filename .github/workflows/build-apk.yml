name: 构建 Android APK

on:
  workflow_dispatch:        # 手动触发：点按钮才构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install

      - name: 构建前端
        run: npm run build

      - name: 添加并同步 Android 平台
        run: |
          if [ -d "android" ]; then
            echo "android 目录已存在，跳过 cap add"
          else
            npm run cap:add
          fi
          npm run cap:sync

      - name: 打包 Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: embytok-apk
          path: android/app/build/outputs/apk/debug/*.apk
